<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>OG cover</title>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .cover {
    width: 1200px; height: 630px; background: #0B1F17;
    display: flex; align-items: center; padding: 0 72px; gap: 64px;
    position: relative;
  }
  .cover::before {
    content: ""; position: absolute; inset: 24px;
    border: 1px solid rgba(232, 220, 196, 0.14); border-radius: 20px;
  }
  .left { flex: 1; }
  .kicker {
    font-family: "Inter", sans-serif; font-weight: 500; font-size: 17px;
    letter-spacing: 0.3em; text-transform: uppercase; color: #C98B5E; margin-bottom: 26px;
  }
  h1 {
    font-family: "Clash Display", sans-serif; font-weight: 700; color: #E8DCC4;
    font-size: 88px; line-height: 1.02; letter-spacing: -0.02em;
  }
  h1 .it { font-family: "Instrument Serif", serif; font-style: italic; color: #C98B5E; }
  .sub {
    margin-top: 30px; font-family: "Inter", sans-serif; font-weight: 500;
    font-size: 21px; color: #A8B3AC; letter-spacing: 0.02em;
  }
  .portrait {
    width: 300px; height: 470px; background: #E8DCC4; border-radius: 24px;
    overflow: hidden; flex: none; position: relative;
  }
  .portrait img {
    width: 100%; height: 100%; object-fit: cover; object-position: top;
    mix-blend-mode: multiply; filter: grayscale(1);
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="left">
      <p class="kicker">Ranojoy Ghosh — Video Editor</p>
      <h1>Videos people<br /><span class="it">can&rsquo;t</span> scroll past.</h1>
      <p class="sub">Reels · Shorts · YouTube · Podcasts · Promos · Color Grading</p>
    </div>
    <div class="portrait">
      <img src="assets/images/profile.png" alt="" />
    </div>
  </div>
</body>
</html>
